
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenderlens-frontend
  namespace: tenderlens
  labels:
    app: tenderlens-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenderlens-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tenderlens-frontend
    spec:
      restartPolicy: Always
      containers:
        - name: frontend
          image: ghcr.io/21sam-05/tenderlens-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
            
