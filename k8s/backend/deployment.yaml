
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenderlens-backend
  namespace: tenderlens
  labels:
    app: tenderlens-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenderlens-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tenderlens-backend
    spec:
      restartPolicy: Always
      containers:
        - name: backend
          image: ghcr.io/21sam-05/tenderlens-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          

          envFrom:
            - secretRef:
                name: tenderlens-secrets
            - configMapRef:
                name: tenderlens-config

          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
