name: TenderLens CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      GEMINI_API_KEY: "ci-only-gemini-key"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      

      - name: Python installation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run Django Checks
        run: python backend/manage.py check

  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Log in to Github Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend Docker image
        run: docker build -t ghcr.io/21sam-05/tenderlens-backend:latest .

      - name: Build frontend Docker image
        run: docker build -t ghcr.io/21sam-05/tenderlens-frontend:latest ./frontend

      
      - name: Push backend Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/21sam-05/tenderlens-backend:latest

      - name: Push frontend Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/21sam-05/tenderlens-frontend:latest

      